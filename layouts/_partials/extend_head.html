{{- /* Head custom content area start */ -}}
<style>
    .post-section-title {
        margin: calc(var(--gap) * 2) 0 var(--gap);
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--secondary);
    }

    .post-section-title:first-of-type {
        margin-top: 0;
    }

    /* AsciiDoc figure captions */
    .post-content .imageblock > .title {
        margin-top: 0.5rem;
        margin-bottom: 1rem;
        font-size: 14px;
        line-height: 1.4;
        text-align: center;
        color: var(--secondary);
    }

    /* Side-by-side image tables (AsciiDoc tables with frame=none grid=none) */
    .post-content .tableblock img {
        width: 100%;
        height: auto;
    }

    .post-content .tableblock td {
        vertical-align: top;
    }
</style>
{{- /* Head custom content area end */ -}}
